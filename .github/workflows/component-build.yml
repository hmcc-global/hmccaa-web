name: Component - Build and Sync Frontend
on:
  workflow_call:
    inputs:
      build_type:
        required: true
        type: string
      # publish_location picks the directory on the server, and sets the
      # concurrency group so that concurrent builds for the same
      # environment (dev/prod) cancel each other.
      publish_location:
        required: true
        type: string
      git_ref:
        required: false
        type: string
        default: ''
      add_robots_txt:
        required: false
        type: boolean
        default: false
    secrets:
      strapi_token:
        required: true
      strapi_api_url:
        required: true
      host_server:
        required: true
      ssh_key:
        required: true
      ssh_host:
        required: true
      ssh_user:
        required: true

jobs:
  build-and-sync-site:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ inputs.publish_location }}
      cancel-in-progress: true
    steps:
      - name: git checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Gatsby
        run: |
          cd ${{ github.workspace }}/frontend

          # Add env file
          echo 'STRAPI_TOKEN=${{ secrets.strapi_token }}' > ./.env.${{ inputs.build_type }}
          echo 'STRAPI_API_URL=${{ secrets.strapi_api_url }}' >> ./.env.${{ inputs.build_type }}

          echo "Running npm ci..."
          npm ci --no-audit --no-fund
          NODE_ENV=${{ inputs.build_type }} HOST_ORIGIN=${{ secrets.host_server }} npm run build
      - name: Add anti-webscraping
        if: ${{ inputs.add_robots_txt }}
        run: |
          echo 'User-agent: *' > ./frontend/public/robots.txt
          echo 'Disallow: /' >> ./frontend/public/robots.txt
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.ssh_key }}
          known_hosts: "placeholder"
          name: id_rsa
      - name: Define known_hosts
        run: ssh-keyscan -H ${{ secrets.ssh_host }} >> ~/.ssh/known_hosts
      - name: Sync files to server
        # --delay-updates stages changed files and only moves them into place
        # once everything has transferred, so a run cancelled mid-sync by a
        # newer build leaves the live site as it was.
        run: rsync -avzr --delete-after --delay-updates ./frontend/public/ ${{ secrets.ssh_user }}@${{ secrets.ssh_host }}:/home/${{ secrets.ssh_user }}/annarbor-${{ inputs.publish_location }}
