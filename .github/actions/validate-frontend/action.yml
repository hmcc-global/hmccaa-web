name: Validate Frontend
inputs:
  strapi_token:
    type: string
    required: true
  strapi_server:
    type: string
    required: true
  host_server:
    type: string
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Restore Gatsby cache from the dev site's build
      # Restore only: a saved cache per pull request would push the prod and
      # dev caches out of the repository's 10 GB cache quota.
      uses: actions/cache/restore@v5
      with:
        path: |
          frontend/.cache
          frontend/public
        key: gatsby-v1-dev-${{ hashFiles('frontend/package-lock.json') }}-
        restore-keys: |
          gatsby-v1-dev-${{ hashFiles('frontend/package-lock.json') }}-
    - name: Build Gatsby
      shell: bash
      run: |
        cd ${{ github.workspace }}/frontend

        # Add env file
        echo 'STRAPI_TOKEN=${{ inputs.strapi_token }}' > ./.env.production
        echo 'STRAPI_API_URL=${{ inputs.strapi_server }}' >> ./.env.production

        echo "Running npm ci..."
        npm ci --no-audit --no-fund
        NODE_ENV=production HOST_ORIGIN=${{ inputs.host_server }} npm run build

        echo "Finished build with error code $?"
